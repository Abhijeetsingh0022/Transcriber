[project]
name = "transcriber"
version = "0.1.0"
description = "High-accuracy local AI transcription, speaker diarization, and batch queue engine."
requires-python = ">=3.10"
dependencies = [
    "torch",
    "torchaudio",
    "faster-whisper>=1.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.6.0",
    "sse-starlette>=2.0.0",
    "psutil>=5.9.0",
    "aiofiles>=23.2.1",
    "requests>=2.31.0",
    "av>=11.0.0",
    "python-docx>=1.1.0",
    "yt-dlp>=2026.8.19",
    "reportlab>=5.0.1",
    "python-dotenv>=1.0.0",
    "google-generativeai>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine", "db", "api", "services", "core"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
